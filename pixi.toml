[workspace]
name = "vleo-aerodynamics-tool"
channels = ["conda-forge"]
platforms = ["win-64"]
requires-pixi = ">=0.74"

# On Windows this still needs system VS 2022 Build Tools: conda-forge can find
# cl.exe but cannot redistribute it.
[dependencies]
cmake = ">=3.21"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"

vtk = "*"
assimp = "*"
glew = "*"
glfw = "*"
glm = "*"
gtest = "*"
spdlog = "*"
cgal-cpp = "*"

# conda-forge's compiler activation exports VS-generator defaults that override
# the Ninja generator in our presets.
[activation.env]
CMAKE_GENERATOR = ""
CMAKE_GENERATOR_PLATFORM = ""
CMAKE_GENERATOR_TOOLSET = ""
CMAKE_ARGS = ""

# Both presets share one build tree, and a build preset does not apply its configure
# preset's cache variables -- so the configure step is what pins BUILD_MATLAB_BINDINGS.
# Skip it and `build-matlab` silently builds no mex whenever `build` ran last.
[tasks]
build = "cmake --preset dev && cmake --build --preset dev"
test = { cmd = "ctest --preset dev", depends-on = ["build"] }
clean = "rm -rf out matlab/bin"

# Run via pixi, not the binary directly: its DLLs live in the pixi env, not on PATH.
run-example = { cmd = "out/build/dev/examples/{{ name }}/{{ name }}", depends-on = ["build"], args = ["name"] }

# Opt-in MATLAB bindings (MATLAB required).
build-matlab = "cmake --preset dev-matlab && cmake --build --preset dev-matlab"

# Formatting and linting. Kept out of the default environment, so the hooks and
# `format` never pull in VTK, assimp or the compiler. Run as `pixi run -e lint <task>`.
[feature.lint.dependencies]
clang-format = "23.*"
gersemi = "*"
prek = "*"

[feature.lint.pypi-dependencies]
miss-hit-core = "*"

[feature.lint.tasks]
format = "prek run --all-files"
setup-hooks = "prek install"
# Uses MATLAB's own analyzer, so it needs a local MATLAB install. Fails on errors only.
lint-matlab = "matlab -batch \"r = codeIssues('matlab/+vat'); n = nnz(r.Issues.Severity == 'error'); fprintf('%d error(s), %d issue(s)\\n', n, height(r.Issues)); exit(double(n > 0))\""

# clang-tidy ships in clang-tools. It reads out/build/dev/compile_commands.json, so run
# `pixi run build` (default env) first. Do not add a build dependency here: building in
# this env makes the post-build gtest discovery fail, because the DLLs live in the default env.
[feature.tidy.dependencies]
clang-tools = "*"

[feature.tidy.tasks]
# run-clang-tidy is an extensionless Python script on Windows, so it is started through python.
lint-cpp = "python .pixi/envs/tidy/Library/bin/run-clang-tidy -p out/build/dev -quiet -extra-arg-before=--driver-mode=cl"

[environments]
lint = { features = ["lint"], no-default-feature = true }
tidy = { features = ["tidy"] }
