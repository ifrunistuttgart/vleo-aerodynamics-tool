# MISS_HIT configuration for mh_style (and mh_lint, if enabled later).
# Format: https://florianschanda.github.io/miss_hit/configuration.html

project_root

line_length : 120
tab_width : 4

# The MATLAB sources use snake_case names and have no copyright headers, so the
# default naming and copyright rules would flag almost everything.
suppress_rule : "naming_functions"
suppress_rule : "naming_parameters"
suppress_rule : "naming_classes"
suppress_rule : "naming_scripts"
suppress_rule : "copyright_notice"

# The examples print intermediate results by omitting the semicolon on purpose.
suppress_rule : "end_of_statements"
